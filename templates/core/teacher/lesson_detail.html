<h2>Занятие: {{ lesson.lesson_date }}</h2>

<form method="post">
    {% csrf_token %}

    <ul>
        {% for e in pupils %}
            <li>
                {{ e.pupil.user.get_full_name }}

                <select name="status_{{ e.pupil.id }}">
                    <option value="1"
                        {% if attendance_dict.e.pupil.id and attendance_dict.e.pupil.id.status == 1 %}
                            selected
                        {% endif %}
                    >✔ Присутствовал</option>

                    <option value="0"
                        {% if attendance_dict.e.pupil.id and attendance_dict.e.pupil.id.status == 0 %}
                            selected
                        {% endif %}
                    >❌ Отсутствовал</option>

                    <option value="2"
                        {% if attendance_dict.e.pupil.id and attendance_dict.e.pupil.id.status == 2 %}
                            selected
                        {% endif %}
                    >⏰ Опоздал</option>
                </select>
            </li>
        {% endfor %}
    </ul>

    <button type="submit">Сохранить</button>
</form>
