{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 760px;">
    <h1 class="mb-4">Данные для договора</h1>

    <form method="post" class="card card-body">
        {% csrf_token %}

        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'parent_dashboard' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
