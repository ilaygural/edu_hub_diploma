{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 640px;">
    <h1 class="mb-4">Новое сообщение</h1>
    <p class="text-muted">Педагог должен вести активную группу вашего ребёнка.</p>

    <form method="post" class="card card-body">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">{{ form.pupil.label }}</label>
            {{ form.pupil }}
            {{ form.pupil.errors }}
        </div>
        <div class="mb-3">
            <label class="form-label">{{ form.teacher.label }}</label>
            {{ form.teacher }}
            {{ form.teacher.errors }}
        </div>
        <div class="mb-3">
            <label class="form-label">{{ form.body.label }}</label>
            {{ form.body }}
            {{ form.body.errors }}
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Отправить</button>
            <a href="{% url 'parent_messages' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
